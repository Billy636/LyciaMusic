[package]
name = "lycia-native-lyrics-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Runs the actual renderer's tests independently of audio/Tauri application changes.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
regex = "=1.12.2"
image = { version = "=0.25.9", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"
windows-numerics = "=0.2.0"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package."*"]
opt-level = 3
